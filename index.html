<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Campass</title>
<style>
  :root {
    --blue:#0d6bff;
    --bg:#0a6cff;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin:0;
    width:100%;
    min-height:100%;
    background: var(--bg);
    overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
  }
  body {
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
      radial-gradient(circle at 20% 85%, rgba(255,255,255,.14) 0 18%, transparent 19% 100%),
      radial-gradient(circle at 82% 12%, rgba(255,255,255,.08) 0 13%, transparent 14% 100%),
      #0b6cff;
  }
  #app {
    position:relative;
    width:100vw;
    height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .stage {
    position:relative;
    display:inline-block;
    width:min(var(--screen-w), 92vw);
    max-height:96dvh;
    animation: screenIn .18s ease-out both;
    filter: drop-shadow(0 26px 42px rgba(0, 39, 118, .26));
    line-height:0;
    user-select:none;
    touch-action:manipulation;
  }
  .stage img {
    display:block;
    width:100%;
    height:auto;
    max-height:96dvh;
    object-fit:contain;
    pointer-events:none;
  }
  .hotspot {
    position:absolute;
    border:0;
    padding:0;
    margin:0;
    background:transparent;
    appearance:none;
    cursor:pointer;
    border-radius:24px;
  }
  .hotspot:focus-visible { outline:2px solid rgba(255,255,255,.72); outline-offset:3px; }
  .flash {
    position:absolute;
    inset:0;
    background:#fff;
    border-radius:44px;
    opacity:0;
    pointer-events:none;
  }
  .flash.on { animation: flash .38s ease-out; }
  @keyframes screenIn {
    from { opacity:.42; transform:translateY(8px) scale(.992); }
    to { opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes flash {
    0% { opacity:0; }
    38% { opacity:.88; }
    100% { opacity:0; }
  }
  @media (max-width: 520px) {
    body { align-items:flex-start; overflow:auto; }
    #app { min-height:100dvh; height:auto; padding:10px 0; }
    .stage { width:min(var(--screen-w), 98vw); max-height:none; filter:none; }
    .stage img { max-height:none; }
  }
</style>
</head>
<body>
<main id="app" aria-label="Campass"></main>

};
const order = Object.keys(screens);
const app = document.getElementById('app');
let current = 'home';

function safeScreen(name) { return screens[name] ? name : 'home'; }
function setScreen(name, push=true) {
  current = safeScreen(name);
  const cfg = screens[current];
  const imgName = cfg.img;
  const [naturalW, naturalH] = sizes[imgName];
  const nominalW = imgName === 'clean' || imgName === 'camera' ? 430 : naturalW;
  app.innerHTML = '';
  const stage = document.createElement('section');
  stage.className = 'stage';
  stage.style.setProperty('--screen-w', `${nominalW}px`);
  stage.style.aspectRatio = `${naturalW} / ${naturalH}`;
  const img = document.createElement('img');
  img.alt = '';
  img.src = images[imgName];
  stage.appendChild(img);
  const flash = document.createElement('div');
  flash.className = 'flash';
  stage.appendChild(flash);
  for (const spot of cfg.next || []) {
    const button = document.createElement('button');
    button.className = 'hotspot';
    button.type = 'button';
    button.style.left = spot.x + '%';
    button.style.top = spot.y + '%';
    button.style.width = spot.w + '%';
    button.style.height = spot.h + '%';
    button.setAttribute('aria-label', '');
    button.addEventListener('click', () => {
      if (spot.flash) {
        flash.classList.remove('on');
        void flash.offsetWidth;
        flash.classList.add('on');
        return;
      }
      if (spot.to) setScreen(spot.to);
    });
    stage.appendChild(button);
  }
  app.appendChild(stage);
  if (push) history.replaceState(null, '', '#' + current);
}
window.addEventListener('hashchange', () => setScreen(location.hash.slice(1) || 'home', false));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') setScreen('home');
  if (e.key === 'ArrowRight') {
    const i = order.indexOf(current);
    setScreen(order[(i + 1) % order.length]);
  }
  if (e.key === 'ArrowLeft') {
    const i = order.indexOf(current);
    setScreen(order[(i - 1 + order.length) % order.length]);
  }
});
setScreen(location.hash.slice(1) || 'home', false);
